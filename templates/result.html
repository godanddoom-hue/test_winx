<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Результат теста</title>
    <link rel="icon" href="{{ url_for('static', filename='media/logo.ico') }}">
    <link type="text/css" href="{{ url_for('static', filename='css/index.css') }}" rel="stylesheet">
    <link type="text/css" href="{{ url_for('static', filename='css/button.css') }}" rel="stylesheet">
    <link type="text/css" href="{{ url_for('static', filename='css/result.css') }}" rel="stylesheet">
</head>
<body>
<img src="static/media/fairy/{{ fairy_name_result }}.png">
<a>"{{ user_name }}" по итогам теста, ты {{ fairy_name_rus }}</a>
<div class="description">
    <p>{{ description }}</p>
</div>
<form action="/start_test" method="post">
    <input type="hidden" name="question_number" value="1">
    <button class="repeat_test_button" type="submit">Начать тест заново</button>
</form>
<form action="/download_certificate" method="post">
    <input type="hidden" name="fairy_name_rus" value="{{ fairy_name_rus }}">
    <button class="download_certificate" type="submit">Скачать сертификат</button>
</form>
</body>
</html>
